[browser]
gatherUsageStats = false

[client]
# The app menu is hidden: the theme is chosen in the sidebar under Pengaturan.
toolbarMode = "minimal"

# Palette "nocturnal": cool slate neutrals tinted toward the accent hue (about 205),
# one cyan accent, separate semantic colors. Light and dark follow the system setting.
# The same values live in workspace_app/ui.py as CSS variables.
[theme]
font = "Geologica:https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&display=swap"
headingFont = "Geologica"
headingFontWeights = [700, 600, 600, 600, 600, 600]
headingFontSizes = ["1.6rem", "1.25rem", "1.05rem"]
baseFontSize = 15
baseRadius = "0.75rem"
showWidgetBorder = true
chartCategoricalColors = ["#2B93AE", "#D98B3A", "#6E8F5A", "#B5547A", "#7A86C9", "#C7B04A", "#5F6B78", "#3FA796"]

[theme.light]
primaryColor = "#0E7490"
backgroundColor = "#EEF1F4"
secondaryBackgroundColor = "#F8FAFB"
textColor = "#101820"
borderColor = "#D5DCE4"
linkColor = "#0E7490"
greenColor = "#1A7F4B"
redColor = "#C0392B"
orangeColor = "#B45309"
yellowColor = "#8A6D00"
blueColor = "#1D6FA5"
violetColor = "#6D5BC0"
grayColor = "#4B5663"
dataframeHeaderBackgroundColor = "#E6EBF0"

[theme.light.sidebar]
backgroundColor = "#F8FAFB"
secondaryBackgroundColor = "#EEF1F4"

[theme.dark]
primaryColor = "#4DC0D8"
backgroundColor = "#0B1117"
secondaryBackgroundColor = "#121A22"
textColor = "#E4EAF0"
borderColor = "#243240"
linkColor = "#4DC0D8"
greenColor = "#5CC98A"
redColor = "#F07178"
orangeColor = "#E8A24A"
yellowColor = "#D9C25A"
blueColor = "#6AA8E8"
violetColor = "#9B8CE0"
grayColor = "#9AA8B6"
dataframeHeaderBackgroundColor = "#18232D"

[theme.dark.sidebar]
backgroundColor = "#0E151C"
secondaryBackgroundColor = "#121A22"
