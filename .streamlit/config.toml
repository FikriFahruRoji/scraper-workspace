[server]
address = "127.0.0.1"
port = 8510

[browser]
gatherUsageStats = false

[client]
# The app menu is hidden; the app has one light theme.
toolbarMode = "minimal"

# Palette "nocturnal": cool slate neutrals tinted toward the accent hue (about 205),
# one cyan accent, separate semantic colors. Light only, dimmed: no pure-white surfaces.
# The same values live in workspace_app/ui.py as CSS variables (LIGHT_TOKENS).
[theme]
base = "light"
font = "Geologica:https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&display=swap"
headingFont = "Geologica"
headingFontWeights = [700, 600, 600, 600, 600, 600]
headingFontSizes = ["1.6rem", "1.25rem", "1.05rem"]
baseFontSize = 15
baseRadius = "0.75rem"
showWidgetBorder = true
chartCategoricalColors = ["#2B93AE", "#D98B3A", "#6E8F5A", "#B5547A", "#7A86C9", "#C7B04A", "#5F6B78", "#3FA796"]
primaryColor = "#0E7490"
backgroundColor = "#D9DEE3"
secondaryBackgroundColor = "#E6EAEE"
textColor = "#101820"
borderColor = "#C2CAD3"
linkColor = "#0E7490"
greenColor = "#1A7F4B"
redColor = "#C0392B"
orangeColor = "#B45309"
yellowColor = "#8A6D00"
blueColor = "#1D6FA5"
violetColor = "#6D5BC0"
grayColor = "#4B5663"
dataframeHeaderBackgroundColor = "#D3D9DF"

[theme.sidebar]
backgroundColor = "#E3E7EB"
secondaryBackgroundColor = "#D9DEE3"
